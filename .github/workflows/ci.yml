name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rules-drift:
    name: Rule Snapshot Drift
    # Only needs git + python3 to diff the bundled snapshot against the
    # gargantua-rules source of truth, so a cheap Linux runner is enough.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bundled rules match their recorded upstream commit
        run: Scripts/sync-rules.sh check

  lint:
    name: SwiftLint & SwiftFormat
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

      - name: Run SwiftFormat (lint)
        run: swiftformat --lint .

  test:
    name: Swift Tests
    # macos-15 with the latest stable Xcode is required: a transitive
    # SwiftPM dependency (mlx-swift-lm) declares
    # `// swift-tools-version: 6.1`, which needs Xcode 16.3+ /
    # Swift 6.1+. The default macos-14 runner ships Xcode 15 / Swift
    # 5.10 and fails dependency resolution.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Print Swift version
        run: swift --version

      # mlx-swift's BuildMetallibPlugin shells out to `xcrun metal` to
      # compile its shaders; the macos-15 runner doesn't ship the Metal
      # Toolchain by default, so the prebuild step fails before any test
      # gets to run. Download the component once per job — output is a
      # silent install, exit-coded.
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # Swift 6 actor-isolation diagnostics are warnings, not errors, so a
      # reverted Sendable conformance would regress with the build and the
      # full suite still green. Package-wide -warnings-as-errors is not
      # usable: the mlx.metallib build plugin carries pre-existing
      # PackagePlugin Path -> URL deprecations that are their own migration.
      # The gate below is scoped to Sources/ instead. It has to be the job's
      # first build — the compiler only emits warnings for files it actually
      # recompiles, so running it after a warm build would pass on anything.
      # --enable-code-coverage matches the test step's flags so those build
      # products get reused.
      - name: Fail on compiler warnings under Sources/
        run: Scripts/check-source-warnings.sh --enable-code-coverage

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Export lcov
        run: |
          test_binary=".build/debug/GargantuaPackageTests.xctest/Contents/MacOS/GargantuaPackageTests"
          if [[ ! -x "$test_binary" ]]; then
            test_binary="$(find .build/debug -path '*.xctest/Contents/MacOS/*' -type f | head -n 1)"
          fi
          if [[ -z "$test_binary" || ! -x "$test_binary" ]]; then
            echo "Unable to locate SwiftPM test executable under .build/debug" >&2
            exit 1
          fi

          xcrun llvm-cov export \
            -format=lcov \
            "$test_binary" \
            -instr-profile .build/debug/codecov/default.profdata \
            -ignore-filename-regex='.build|Tests' > coverage.lcov

      # The licensed configuration compiles in the trial clock and the license
      # gate, so every test wrapped in `#if GARGANTUA_LICENSING` — the whole
      # blocked-path corpus — is dead code in the run above. Runs after the
      # lcov export because rebuilding with the flag replaces the instrumented
      # test binary the export step reads.
      - name: Test (licensing build)
        run: |
          set -o pipefail
          GARGANTUA_LICENSING=1 swift test 2>&1 | tee licensed-test.log
          # A licensing-only test has to appear in the output. Without this the
          # step would pass green if the flag never reached the compiler and the
          # unlicensed suite simply re-ran.
          grep -q 'Every surface is denied authorization when the gate is blocked' licensed-test.log
          # The gated build above never sets GARGANTUA_LICENSING, so warnings
          # inside #if GARGANTUA_LICENSING branches are invisible to it. This
          # log is from the build that does compile them.
          Scripts/check-source-warnings.sh --check-log licensed-test.log

      - name: Enforce coverage floor (78%)
        run: Scripts/coverage-priorities.sh coverage.lcov --fail-under 78

      - name: Summarize low-coverage service and model files
        run: Scripts/coverage-priorities.sh coverage.lcov --limit 20 --min-lines 20

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov

  deps:
    name: Dependency scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install osv-scanner
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan pinned SwiftPM dependencies for known CVEs
        run: Scripts/osv-spm-scan.sh
