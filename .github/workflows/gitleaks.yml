name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so PRs scan every commit
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_<version>_linux_x64.tar.gz from the release's checksums.txt.
          # Bump both together.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLo /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner .

      # gitleaks' built-in config never opens lockfiles, *.svg, go.mod, vendored
      # directories and a few more. Scan the tracked ones again under neutral names.
      # The list mirrors secret-gate.sh in the repo-ready skill.
      - name: Scan files gitleaks skips by default
        env:
          SKIPPED: 'gitleaks\.toml|\.(bmp|gif|jpe?g|png|svg|tiff?|eot|[ot]tf|woff2?|docx?|xlsx?|pdf|bin|socket|vsidx|v2|suo|wsuo|dll|pdb|exe|gltf|gem)$|go\.(mod|sum|work(\.sum)?)$|(^|/)(node_modules|bower_components|vendor)/|(^|/)(deno\.lock|npm-shrinkwrap\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|pipfile\.lock|poetry\.lock|gradle\.lockfile|gradlew(\.bat)?|mvnw(\.cmd)?|javascript\.json)$|(^|/)\.mvn/wrapper/|(^|/)(angular|bootstrap|jquery(-?ui)?|plotly|swagger-?ui)[a-z0-9.-]*\.js(\.map)?$|verification-metadata\.xml|database\.refactorlog|(^|/)(v?env|virtualenv)/lib|(^|/)(lib(64)?/python[23]|python/[23])|\.dist-info(/|$)|\.min\.js(\.map)?$'
        run: |
          tmp=$(mktemp -d); n=0
          git ls-files -z | while IFS= read -r -d '' f; do
            [ "$f" = ".gitleaks.toml" ] && continue
            if printf '%s' "$f" | tr 'A-Z' 'a-z' | grep -qE "$SKIPPED"; then
              n=$((n + 1)); cp -- "$f" "$tmp/$n.txt"; printf '%s.txt  %s\n' "$n" "$f" >> "$tmp.map"
            fi
          done
          [ -s "$tmp.map" ] || exit 0
          gitleaks dir --config .gitleaks.toml --redact --verbose --no-banner --max-archive-depth 3 "$tmp" || {
            echo "The numbered files above are:"; cat "$tmp.map"; exit 1
          }
