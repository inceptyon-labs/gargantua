name: CodeQL

# Advanced setup, replacing the repository's CodeQL default setup, because
# default setup cannot build this package: Swift analysis has to trace a real
# build, and that build needs Xcode 26.4+ (mlx-swift declares
# swift-tools-version 6.3) plus the Metal Toolchain for mlx-swift's
# BuildMetallibPlugin. The Objective-C shim (GargantuaAppKitShims) is not
# analyzed: CodeQL's C/C++ extractor does not support Objective-C.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 7 * * 1" # Mondays 07:23 UTC, for new queries against unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CodeQL supports Swift 5.4 through 6.3. latest-stable would move this
      # job to Swift 6.4 as soon as the runner image ships Xcode 27, and the
      # extractor would stop working, so it stays on the Xcode 26 line (26.4
      # or newer for mlx-swift) until CodeQL supports the next compiler.
      - name: Select Xcode 26
        if: matrix.language == 'swift'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "^26.4"

      - name: Install Metal Toolchain
        if: matrix.language == 'swift'
        run: |
          swift --version
          xcodebuild -downloadComponent MetalToolchain

      # Fetch dependencies before tracing starts, so the traced build is
      # compilation only and not the git clones.
      - name: Resolve packages
        if: matrix.language == 'swift'
        run: swift package resolve

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.language == 'swift'
        run: swift build

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
