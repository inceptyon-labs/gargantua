  - id: final_cut_cache
    name: Final Cut Pro Cache
    paths:
      - "~/Library/Caches/com.apple.FinalCut"
    safety: safe
    confidence: 91
    explanation: "Final Cut Pro cache directory from Mole. Libraries, events, projects, and media folders are excluded."
    source:
      name: Final Cut Pro
      bundle_id: com.apple.FinalCut
      verify_signature: true
    regenerates: true
    category: app_cache
    tags:
      - app
      - creative
      - video
      - final_cut
      - cache

  # Evidence (2026-11-07): ~/Movies/LUGaming2026.fcpbundle/1-18-26/Render Files/High Quality Media
  # held 90 GB and .../Transcoded Media/High Quality Media held 68 GB in a 219 GB library.
  - id: final_cut_render_files
    name: Final Cut Pro Render Files
    paths:
      - "~/Movies/**/*.fcpbundle/*/Render Files/High Quality Media"
    skip_if_process_running:
      - com.apple.FinalCut
      - Final Cut Pro
    safety: review
    confidence: 85
    explanation: "Render files inside a Final Cut Pro library. Final Cut re-renders them from the timeline when needed. Review because re-rendering a long project takes time; original media and projects are untouched."
    source:
      name: Final Cut Pro
      bundle_id: com.apple.FinalCut
      verify_signature: true
    regenerates: true
    regenerate_command: "Final Cut Pro > Modify > Render All"
    category: app_data
    tags:
      - app
      - creative
      - video
      - final_cut
      - render
      - review

  - id: final_cut_transcoded_media
    name: Final Cut Pro Optimized and Proxy Media
    paths:
      - "~/Movies/**/*.fcpbundle/*/Transcoded Media/High Quality Media"
      - "~/Movies/**/*.fcpbundle/*/Transcoded Media/Proxy Media"
    skip_if_process_running:
      - com.apple.FinalCut
      - Final Cut Pro
    safety: review
    confidence: 75
    explanation: "Optimized and proxy media Final Cut Pro transcoded from a library's original footage. Review because Final Cut needs the original media to rebuild it; if the originals are offline, this may be the only playable copy."
    source:
      name: Final Cut Pro
      bundle_id: com.apple.FinalCut
      verify_signature: true
    regenerates: true
    regenerate_command: "Final Cut Pro > File > Transcode Media"
    category: app_data
    tags:
      - app
      - creative
      - video
      - final_cut
      - transcoded_media
      - review

  - id: davinci_resolve_cache
    name: DaVinci Resolve Cache
    paths:
      - "~/Library/Caches/com.blackmagic-design.DaVinciResolve"
    safety: safe
    confidence: 90
    explanation: "DaVinci Resolve cache directory from Mole. Project databases and media folders are excluded."
    source:
      name: DaVinci Resolve
      bundle_id: com.blackmagic-design.DaVinciResolve
    regenerates: true
    category: app_cache
    tags:
      - app
      - creative
      - video
      - davinci
      - cache

  - id: davinci_resolve_cacheclip
    name: DaVinci Resolve CacheClip
    paths:
      - "~/Movies/CacheClip"
    safety: review
    confidence: 78
    explanation: "DaVinci Resolve render-cache media from Mole. Review because it lives in Movies and may be tied to active projects."
    source:
      name: DaVinci Resolve
    regenerates: true
    category: app_data
    tags:
      - app
      - creative
      - video
      - davinci
      - cache
      - review

  - id: three_d_cad_caches
    name: 3D and CAD Caches
    paths:
      - "~/Library/Caches/org.blenderfoundation.blender"
      - "~/Library/Caches/com.maxon.cinema4d"
      - "~/Library/Caches/com.autodesk.*"
