rules:
  - id: codex_caches
    name: Codex Caches and Logs
    paths:
      - "~/Library/Logs/com.openai.codex"
      - "~/Library/Application Support/Codex/Cache"
      - "~/Library/Application Support/Codex/Code Cache"
      - "~/Library/Application Support/Codex/GPUCache"
      - "~/Library/Application Support/Codex/DawnGraphiteCache"
      - "~/Library/Application Support/Codex/DawnWebGPUCache"
    safety: safe
    confidence: 95
    explanation: "Codex Electron and CLI caches/logs. Recreated by Codex and do not include project workspaces."
    source:
      name: Codex
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - ai
      - cache
      - logs

  - id: claude_desktop_caches
    name: Claude Desktop Caches
    paths:
      - "~/Library/Application Support/Claude/Cache"
      - "~/Library/Application Support/Claude/Code Cache"
      - "~/Library/Application Support/Claude/GPUCache"
      - "~/Library/Application Support/Claude/DawnGraphiteCache"
      - "~/Library/Application Support/Claude/DawnWebGPUCache"
      - "~/Library/Application Support/Claude/sentry"
    safety: safe
    confidence: 94
    explanation: "Claude Desktop runtime, GPU, and crash-report caches. Recreated by the app."
    source:
      name: Claude Desktop
      bundle_id: com.anthropic.claudefordesktop
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - ai
      - cache

  - id: claude_pending_uploads
    name: Claude Pending Uploads
    paths:
      - "~/Library/Application Support/Claude/pending-uploads"
    safety: review
    confidence: 70
    explanation: "Claude pending upload staging data. Review before removal in case an upload has not synced."
    source:
      name: Claude Desktop
      bundle_id: com.anthropic.claudefordesktop
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - ai
      - review

  - id: antigravity_caches
    name: Antigravity Caches
    paths:
      - "~/Library/Application Support/Antigravity/Cache"
      - "~/Library/Application Support/Antigravity/Code Cache"
      - "~/Library/Application Support/Antigravity/GPUCache"
      - "~/Library/Application Support/Antigravity/DawnGraphiteCache"
      - "~/Library/Application Support/Antigravity/DawnWebGPUCache"
    safety: safe
    confidence: 94
    explanation: "Antigravity Electron caches. Recreated by the app and separate from user workspaces."
    source:
      name: Antigravity
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - ai
      - cache

  - id: qoder_caches
    name: Qoder Caches and Logs
    paths:
      - "~/Library/Application Support/Qoder/Cache"
      - "~/Library/Application Support/Qoder/CachedData"
      - "~/Library/Application Support/Qoder/CachedExtensionVSIXs"
      - "~/Library/Application Support/Qoder/Code Cache"
      - "~/Library/Application Support/Qoder/GPUCache"
      - "~/Library/Application Support/Qoder/DawnGraphiteCache"
      - "~/Library/Application Support/Qoder/DawnWebGPUCache"
      - "~/Library/Application Support/Qoder/logs"
    safety: safe
    confidence: 94
    explanation: "Qoder runtime, extension-package, GPU, and log caches. Recreated by the app."
    source:
      name: Qoder
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - ai
      - editor
      - cache

  - id: opencode_cache
    name: OpenCode Cache
    paths:
      - "~/.cache/opencode"
    safety: safe
    confidence: 94
    explanation: "OpenCode cache files. Recreated by OpenCode when needed."
    source:
      name: OpenCode
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - ai
      - cache

  # --- Agent session history, transcripts, and per-project state ---------------
  #
  # AI coding agents keep a per-project record of every conversation: JSONL
  # transcripts, generated images, screenshots, and edit-undo stores. None of it
  # is needed to run the tool, but it is user-authored content, so anything that
  # holds conversation or output is `review` and age-gated. Only the caches the
  # tool rebuilds on its own are `safe`.

  - id: claude_code_caches
    name: Claude Code Caches
    paths:
      - "~/.claude/cache"
      - "~/.claude/statsig"
      - "~/.claude/ide"
    safety: safe
    confidence: 93
    explanation: "Claude Code CLI scratch cache, telemetry cache, and IDE handshake lockfiles. Rebuilt on the next session; settings, skills, commands, agents, and plugins are not matched."
    source:
      name: Claude Code
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - ai
      - cache

  - id: claude_code_shell_snapshots
    name: Claude Code Shell Snapshots
    paths:
      - "~/.claude/shell-snapshots"
    pattern: "*"
    match_filters:
      - "mtime > 7d"
    safety: safe
    confidence: 90
    explanation: "Snapshots of your shell environment captured so a session can reproduce it. Claude Code writes a fresh one per session; snapshots older than a week belong to sessions that have ended."
    source:
      name: Claude Code
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - ai
      - cache

  - id: claude_code_pasted_content
    name: Claude Code Pasted Content
    paths:
      - "~/.claude/paste-cache"
      - "~/.claude/image-cache"
    pattern: "*"
    match_filters:
      - "mtime > 30d"
    safety: review
    confidence: 72
    explanation: "Text and images you pasted into a Claude Code session, stored outside the transcript that references them. Removing an entry leaves the matching paste unreadable in that old session."
    source:
      name: Claude Code
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - ai_history
      - review

  - id: claude_code_project_transcripts
    name: Claude Code Session Transcripts
    paths:
      - "~/.claude/projects/*"
    pattern: "*.jsonl"
    match_filters:
      - "mtime > 60d"
    safety: review
    confidence: 74
    explanation: "One conversation transcript, kept so the session can be resumed with --resume. Age is measured per transcript because resuming appends to an existing file without touching its project folder. Removing it permanently drops that session's history."
    source:
      name: Claude Code
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - ai_history
      - review

  - id: claude_code_file_history
    name: Claude Code Edit History
    paths:
      - "~/.claude/file-history"
    pattern: "*"
    match_filters:
      - "mtime > 30d"
    safety: review
    confidence: 70
    explanation: "Pre-edit copies of files Claude Code changed, used to rewind edits. Removing an entry gives up the ability to undo that session's edits."
    source:
      name: Claude Code
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - ai_history
      - review

  - id: codex_session_rollouts
    name: Codex Session Rollouts
    paths:
      - "~/.codex/sessions/*/*"
      - "~/.codex/archived_sessions"
    match_filters:
      - "mtime > 90d"
    safety: review
    confidence: 74
    explanation: "Codex rollout transcripts, filed by year and month. They are the record of past Codex conversations and are only needed to resume or re-read an old thread."
    source:
      name: Codex
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - ai_history
      - review

  - id: codex_cache
    name: Codex Cache
    paths:
      - "~/.codex/cache"
      - "~/.codex/models_cache.json"
    safety: safe
    confidence: 92
    explanation: "Codex on-disk cache and cached model catalog. Recreated on the next run. The .tmp directory is not matched — despite the name it holds installed plugins and marketplaces."
    source:
      name: Codex
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - ai
      - cache

  - id: codex_computer_use_screenshots
    name: Codex Computer-Use Screenshots
    paths:
      - "~/.codex/computer-use"
    pattern: "*"
    match_filters:
      - "mtime > 14d"
    safety: safe
    confidence: 88
    explanation: "Screenshots Codex captured while driving the screen. Captured fresh each run and not referenced once the turn is over."
    source:
      name: Codex
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - ai
      - cache

  - id: codex_generated_images
    name: Codex Generated Images
    paths:
      - "~/.codex/generated_images"
    pattern: "*"
    match_filters:
      - "mtime > 30d"
    safety: review
    confidence: 68
    explanation: "Images Codex generated during past sessions. These are outputs you may still want, so they are surfaced for review rather than cleared automatically."
    source:
      name: Codex
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - ai_history
      - review

  - id: gemini_cli_chat_history
    name: Gemini CLI Chat History
    paths:
      - "~/.gemini/tmp/*/chats"
    pattern: "*"
    match_filters:
      - "mtime > 60d"
    safety: review
    confidence: 72
    explanation: "A saved Gemini CLI conversation for one project. Despite living under tmp/ these are full session records, not scratch files, so they are surfaced for review rather than cleared."
    source:
      name: Gemini CLI
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - ai_history
      - review

  - id: antigravity_browser_caches
    name: Antigravity Browser Caches
    paths:
      - "~/.gemini/antigravity-browser-profile/Default/Cache"
      - "~/.gemini/antigravity-browser-profile/Default/Code Cache"
      - "~/.gemini/antigravity-browser-profile/Default/GPUCache"
      - "~/.gemini/antigravity-browser-profile/Default/DawnGraphiteCache"
      - "~/.gemini/antigravity-browser-profile/Default/DawnWebGPUCache"
      - "~/.gemini/antigravity-browser-profile/Default/Service Worker/CacheStorage"
      - "~/.gemini/antigravity-browser-profile/Default/Service Worker/ScriptCache"
      - "~/.gemini/antigravity-browser-profile/GraphiteDawnCache"
      - "~/.gemini/antigravity-browser-profile/GrShaderCache"
      - "~/.gemini/antigravity-browser-profile/ShaderCache"
      - "~/.gemini/antigravity-browser-profile/component_crx_cache"
      - "~/.gemini/antigravity-browser-profile/extensions_crx_cache"
    safety: safe
    confidence: 94
    explanation: "Chromium cache directories inside the profile Antigravity drives for browser automation. The profile root is not matched — it holds cookies, accounts, and client certificates."
    source:
      name: Antigravity
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - ai
      - cache

  - id: vscode_family_local_history
    name: Editor Local File History
    paths:
      - "~/Library/Application Support/Code/User/History"
      - "~/Library/Application Support/Cursor/User/History"
      - "~/Library/Application Support/Windsurf/User/History"
      - "~/Library/Application Support/VSCodium/User/History"
    pattern: "*"
    match_filters:
      - "mtime > 60d"
    safety: review
    confidence: 72
    explanation: "Local file history the editor keeps so you can restore an earlier version of a file, including versions an AI assistant overwrote. Removing an entry gives up those restore points."
    source:
      name: VS Code
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - editor
      - ai_history
      - review

  - id: windsurf_caches
    name: Windsurf Caches and Logs
    paths:
      - "~/Library/Application Support/Windsurf/Cache"
      - "~/Library/Application Support/Windsurf/CachedData"
      - "~/Library/Application Support/Windsurf/CachedExtensionVSIXs"
      - "~/Library/Application Support/Windsurf/Code Cache"
      - "~/Library/Application Support/Windsurf/GPUCache"
      - "~/Library/Application Support/Windsurf/DawnGraphiteCache"
      - "~/Library/Application Support/Windsurf/DawnWebGPUCache"
      - "~/Library/Application Support/Windsurf/logs"
      - "~/Library/Caches/Windsurf"
    safety: safe
    confidence: 94
    explanation: "Windsurf runtime, extension-package, GPU, and log caches. Recreated by the editor; user settings and workspaces are not matched."
    source:
      name: Windsurf
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - editor
      - ai
      - cache

  - id: cursor_logs_and_crash_reports
    name: Cursor Logs and Crash Reports
    paths:
      - "~/Library/Application Support/Cursor/logs"
      - "~/Library/Application Support/Cursor/Crashpad/completed"
      - "~/Library/Application Support/Cursor/blob_storage"
    safety: safe
    confidence: 93
    explanation: "Cursor session logs, submitted crash reports, and transient blob storage. Recreated by the editor as needed."
    source:
      name: Cursor
      bundle_id: com.todesktop.230313mzl4w4u92
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - editor
      - ai
      - logs

  - id: continue_index
    name: Continue Codebase Index
    paths:
      - "~/.continue/index"
    safety: safe
    confidence: 90
    explanation: "Continue's local codebase index and embeddings. Rebuilt by re-indexing the workspace."
    source:
      name: Continue
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - ai
      - cache

  - id: continue_sessions
    name: Continue Chat Sessions
    paths:
      - "~/.continue/sessions"
    pattern: "*"
    match_filters:
      - "mtime > 90d"
    safety: review
    confidence: 72
    explanation: "Saved Continue chat sessions. Removing them permanently drops that conversation history."
    source:
      name: Continue
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - ai_history
      - review

  - id: aider_project_caches
    name: Aider Repo Map Cache
    paths:
      - "**/.aider.tags.cache.v3"
    safety: safe
    confidence: 93
    explanation: "Aider's per-repository tag cache used to build its repo map. Rebuilt on the next aider run in that project."
    source:
      name: Aider
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - ai
      - cache

  - id: aider_project_chat_history
    name: Aider Project Chat History
    paths:
      - "**/.aider.chat.history.md"
      - "**/.aider.input.history"
    match_filters:
      - "mtime > 60d"
    safety: review
    confidence: 70
    explanation: "Aider's per-project transcript and prompt history. Removing them drops that project's aider conversation record."
    source:
      name: Aider
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - ai_history
      - review

  - id: specstory_history
    name: SpecStory Session History
    paths:
      - "**/.specstory/history"
    pattern: "*"
    match_filters:
      - "mtime > 60d"
    safety: review
    confidence: 70
    explanation: "SpecStory's exported AI chat history for a project. Removing an entry drops that saved conversation."
    source:
      name: SpecStory
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - ai_history
      - review

  # --- Agent history for tools verified against their own storage code ---------
  #
  # Every path below was read out of the tool's path-building source or its
  # vendor docs, not inferred from a directory name. Tools whose layout could
  # only be sourced from third-party bug reports are deliberately absent.

  - id: qwen_code_shell_history
    name: Qwen Code Shell History
    paths:
      - "~/.qwen/tmp/*/shell_history"
    match_filters:
      - "mtime > 60d"
    safety: review
    confidence: 72
    explanation: "Shell commands Qwen Code ran for one project, kept for history recall. It is a record of your own commands, so it is surfaced for review; credentials and settings elsewhere under ~/.qwen are not matched."
    source:
      name: Qwen Code
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - ai_history
      - review

  - id: gemini_cli_shell_history
    name: Gemini CLI Shell History
    paths:
      - "~/.gemini/tmp/*/shell_history"
    match_filters:
      - "mtime > 60d"
    safety: review
    confidence: 72
    explanation: "Shell commands Gemini CLI ran for one project, kept for history recall. It is a record of your own commands, so it is surfaced for review; credentials and settings elsewhere under ~/.gemini are not matched."
    source:
      name: Gemini CLI
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - ai_history
      - review

  - id: goose_legacy_sessions
    name: Goose Legacy Session Records
    paths:
      - "~/.local/share/goose/sessions"
    pattern: "*.jsonl"
    match_filters:
      - "mtime > 60d"
    safety: review
    confidence: 70
    explanation: "Goose session transcripts in the pre-1.10 JSONL format. Goose moved sessions into sessions.db and, by its own documentation, no longer manages these files. Treat them as the only copy of that conversation unless you know the import succeeded. Only .jsonl files are matched, never sessions.db."
    source:
      name: Goose
    regenerates: false
    category: dev_artifacts
    tags:
      - developer
      - ai_history
      - review

  - id: continue_logs
    name: Continue Logs
    paths:
      - "~/.continue/logs/core.log"
      - "~/.continue/logs/prompt.log"
    safety: safe
    confidence: 92
    explanation: "The two log files Continue writes. Recreated on the next run; sessions and configuration are not matched."
    source:
      name: Continue
    regenerates: true
    category: dev_artifacts
    tags:
      - developer
      - ai
      - logs
